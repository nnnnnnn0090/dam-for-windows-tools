<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1118">
<title>{{REMOTE_NAME}}</title>
<style>
:root{color-scheme:dark;--bg:#0b0e13;--panel:#171c24;--line:#3b4552;--line2:#2b333e;--text:#f5f6f8;--muted:#aeb7c2;--blue:#0a78b4;--pink:#db2551;--pink2:#93102f;--gold:#e4b43c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Meiryo",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:default}body{padding-bottom:69px;background:linear-gradient(180deg,#151a22 0,#090c11 210px)}
.top{position:sticky;top:0;z-index:20;border-bottom:1px solid #52606e;background:#0d1219}.topline{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#151c25}.brand{font-weight:1000;letter-spacing:.5px;color:#fff}.brand em{font-style:normal;color:#ef315d}.brand small{margin-left:7px;font-size:9px;color:#9eabb9;letter-spacing:1.2px}.connection{display:flex;gap:6px;align-items:center;font-size:11px;color:#aab4c0}.lamp{width:8px;height:8px;border-radius:50%;background:#697480}.lamp.on{background:#58d590;box-shadow:0 0 7px #58d590}.now{width:100%;height:53px;border:0;background:#090d13;display:grid;grid-template-columns:34px minmax(0,1fr) 42px;align-items:center;padding:0 10px;text-align:left}.playmark{color:#ff4169;font-size:16px;text-align:center}.nowtext{min-width:0}.nowtitle{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowartist{font-size:10px;color:#9ca7b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.keymini{height:29px;display:grid;place-items:center;border:1px solid #4c5867;background:#1c2430;font-weight:900}
main{max-width:760px;margin:auto}.view{display:none;padding:10px}.view.active{display:block}.head{min-height:41px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #525c68;margin-bottom:9px}.head h1,.head h2{font-size:17px;margin:0}.count{font-size:11px;color:#b6bfca}.refresh{height:31px;border:1px solid #596677;background:#26303d;font-size:12px;font-weight:800}
.modes{display:grid;grid-template-columns:repeat(3,1fr);border-left:1px solid #4a5563;border-top:1px solid #4a5563;margin-bottom:9px}.mode{height:62px;border:0;border-right:1px solid #4a5563;border-bottom:1px solid #4a5563;background:#1c232d;font-size:12px;font-weight:800}.mode b{display:block;font-size:20px;line-height:23px;color:#f0bd48}.mode.active{background:#9e1432;box-shadow:inset 0 -3px #ff5679}.searchbox{display:grid;grid-template-columns:minmax(0,1fr) 82px;border:2px solid #738091}.searchbox.hidden{display:none}.searchbox input{height:48px;border:0;outline:0;background:#fff;color:#111722;padding:0 12px;font-size:16px}.searchbox button{border:0;border-left:1px solid #07517e;background:#087ab7;font-weight:900}.status{min-height:37px;padding:9px 2px;color:#c1c8d1;font-size:12px}
.list{border:1px solid var(--line);background:var(--panel)}.selectrow{width:100%;min-height:66px;border:0;border-bottom:1px solid var(--line2);background:transparent;display:grid;grid-template-columns:minmax(0,1fr) 31px;align-items:center;padding:9px 8px 9px 12px;text-align:left}.selectrow:last-child{border-bottom:0}.selectrow:active{background:#26313e}.songtitle{font-size:15px;font-weight:900;line-height:1.35}.songmeta{font-size:11px;color:var(--muted);margin-top:4px}.chevron{font-size:26px;color:#d6a933;text-align:center}.artistmark{color:#f1bd42}.empty{padding:30px 12px;text-align:center;color:#909aa7}
.detailbar{height:42px;display:grid;grid-template-columns:80px minmax(0,1fr) 80px;align-items:center;border-bottom:1px solid #596573;margin:-2px 0 10px}.back{height:31px;border:1px solid #596677;background:#27313e;font-weight:800}.detailbar strong{text-align:center}.detailtrack{position:relative;border:1px solid #596573;background:#11161d;padding:18px 54px 16px 15px}.detailtrack h1{font-size:22px;line-height:1.35;margin:0 0 8px}.detailartist{border:0;background:transparent;padding:0;color:#f2c04c;font-size:15px;font-weight:800;text-align:left;text-decoration:underline;text-underline-offset:3px}.detailid{font-size:11px;color:#96a1ae;margin-top:7px}.detailfav{position:absolute;right:10px;top:10px;width:39px;height:39px;border:1px solid #596575;background:#202832;color:#8793a1;font-size:24px}.detailfav.on{color:#ffd34d;border-color:#b9922e}.songfacts{margin:0;border:1px solid var(--line);border-top:0;background:#11161d}.songfacts div{display:grid;grid-template-columns:82px minmax(0,1fr);min-height:39px;border-bottom:1px solid var(--line2);align-items:center;padding:6px 10px}.songfacts div:last-child{border-bottom:0}.songfacts dt{font-size:11px;color:#aeb8c4}.songfacts dd{margin:0;font-size:13px;font-weight:800;line-height:1.4}.artistworks{width:100%;height:43px;margin:8px 0 10px;border:1px solid #4d82a0;background:#163c52;text-align:left;padding:0 12px;font-weight:800}.artistworks span{float:right;font-size:20px}
.setting{border:1px solid var(--line);background:var(--panel);margin-bottom:9px}.settingrow{min-height:57px;display:grid;grid-template-columns:82px minmax(0,1fr);align-items:center;border-bottom:1px solid var(--line2);padding:7px 9px}.settingrow:last-child{border-bottom:0}.settingname{font-size:11px;font-weight:800;color:#c0c8d2}.keyset{display:grid;grid-template-columns:44px 55px 44px minmax(82px,1fr);gap:5px}.step,.keyvalue,.choice,.original{height:38px;border:1px solid #586575;background:#27313e;font-weight:900}.keyvalue{display:grid;place-items:center;background:#080c12;font-size:17px}.original{font-size:10px}.original.on,.choice.on{border-color:#f05a75;background:#9f1734}.scorechoices,.playchoices{display:grid;gap:5px}.scorechoices{grid-template-columns:1fr 1fr}.playchoices{grid-template-columns:repeat(auto-fit,minmax(84px,1fr))}.choice{font-size:12px}.reservearea{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:7px;margin-top:10px}.reservebutton{height:61px;border:2px solid #ff7992;background:linear-gradient(#ec3c61,#a30e31);font-size:18px;font-weight:1000}.reservebutton.cut{border-color:#f0c75f;background:linear-gradient(#d89b26,#88550d);font-size:14px}.detailmessage{min-height:31px;padding:8px 2px;color:#f2c34f;font-size:12px}
.queue{border:1px solid var(--line);background:var(--panel)}.queueitem{display:grid;grid-template-columns:42px minmax(0,1fr);border-bottom:1px solid var(--line2)}.queueitem:last-child{border-bottom:0}.orderno{display:grid;place-items:center;background:#222b37;font-size:17px;font-weight:900}.orderno.cut{font-size:10px;background:#87550e;writing-mode:vertical-rl}.queuebody{padding:9px}.queueactions{display:flex;gap:5px;margin-top:8px}.queueactions button{height:32px;border:1px solid #586575;background:#27313e;font-size:12px;font-weight:800}.queueactions .remove{margin-left:auto;background:#711a30;border-color:#aa4058}
.console{border:1px solid var(--line);background:var(--panel)}.display{padding:15px;text-align:center;background:#080c11;border-bottom:1px solid var(--line)}.display .songtitle{font-size:18px}.controls{padding:11px}.control-label{font-size:11px;color:var(--muted);margin:4px 0 7px}.keyrow{display:grid;grid-template-columns:1fr 70px 1fr;gap:6px}.keybutton,.keyreset,.transport,.globalscore{border:1px solid #596777;background:#273240;font-weight:900}.keybutton,.keyreset{height:52px}.keyreset{background:#090d13;font-size:19px}.transportgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.transport{height:65px}.transport.primary{background:#086a9e}.transport.stop{grid-column:1/3;height:50px;background:#911631;border-color:#d84c68}.globalscore{width:100%;height:49px;margin-bottom:12px;text-align:left;padding:0 13px}.globalscore.on{background:#9f1734;border-color:#f05a75}.globalscore span{float:right}
.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);background:#0d1219;border-top:1px solid #536071}.nav{height:64px;max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;border-right:1px solid #303945;background:#1b232e;color:#abb5c0;font-size:10px;font-weight:900}.nav button:last-child{border-right:0}.nav b{display:block;font-size:20px;line-height:24px}.nav button.active{background:#0873ad;color:#fff;box-shadow:inset 0 3px #70cef8}.toast{position:fixed;z-index:50;left:50%;bottom:79px;transform:translate(-50%,12px);max-width:calc(100% - 24px);padding:10px 14px;background:#f5f6f8;color:#111722;box-shadow:0 4px 18px #000b;opacity:0;pointer-events:none;transition:.15s;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:390px){.view{padding:8px}.settingrow{grid-template-columns:70px minmax(0,1fr);padding:7px 6px}.keyset{grid-template-columns:39px 49px 39px minmax(72px,1fr)}.choice{font-size:11px}.detailtrack h1{font-size:20px}}
</style>
</head>
<body>
<header class="top">
  <div class="topline"><div class="brand"><em>DAM</em><small>非公式 REMOTE</small></div><div class="connection"><i class="lamp" id="lamp"></i><span id="connection">接続確認中</span></div></div>
  <button class="now" id="nowPlaying" type="button"><div class="playmark" id="playmark">■</div><div class="nowtext"><div class="nowtitle" id="nowtitle">再生中の曲はありません</div><div class="nowartist" id="nowartist">{{PRODUCT_NAME}}</div></div><div class="keymini" id="keymini">0</div></button>
</header>
<main>
<section class="view active" id="view-search">
  <div class="head"><h1>曲を選ぶ</h1><span class="count" id="resultCount"></span></div>
  <div class="modes">
    <button class="mode active" data-mode="keyword" type="button"><b>⌕</b>キーワード</button><button class="mode" data-mode="title" type="button"><b>曲</b>曲名</button><button class="mode" data-mode="artist" type="button"><b>人</b>歌手名</button>
    <button class="mode" data-mode="ranking" type="button"><b>冠</b>ランキング</button><button class="mode" data-mode="new" type="button"><b>新</b>新曲</button><button class="mode" data-mode="favorites" type="button"><b>★</b>お気に入り</button>
  </div>
  <form class="searchbox" id="search"><input id="query" maxlength="80" autocomplete="off" enterkeyhint="search" placeholder="曲名・歌手名・歌詞を入力"><button id="searchButton">検索</button></form>
  <div class="status" id="searchStatus">検索方法を選んでください</div>
  <section class="list" id="results"><div class="empty">検索結果がここに表示されます</div></section>
</section>
<section class="view" id="view-detail">
  <div class="detailbar"><button class="back" id="detailBack" type="button">‹ 戻る</button><strong>曲の詳細</strong><span></span></div>
  <section class="detailtrack"><h1 id="detailTitle">曲名</h1><button class="detailartist" id="detailArtist" type="button">アーティスト</button><div class="detailid" id="detailId"></div><button class="detailfav" id="detailFavorite" type="button" aria-label="お気に入り">☆</button></section>
  <dl class="songfacts"><div><dt>歌いだし</dt><dd id="detailStartLyric">取得中…</dd></div><div><dt>原曲キー</dt><dd id="detailOriginalKey">取得中…</dd></div></dl>
  <button class="artistworks" id="artistSongs" type="button">この歌手の曲<span>›</span></button>
  <section class="setting" aria-label="予約設定">
    <div class="settingrow"><div class="settingname">キー</div><div class="keyset"><button class="step" id="reserveKeyDown" type="button">♭</button><div class="keyvalue" id="reserveKey">0</div><button class="step" id="reserveKeyUp" type="button">♯</button><button class="original" id="originalKey" type="button">原曲キー</button></div></div>
    <div class="settingrow"><div class="settingname">採点</div><div class="scorechoices"><button class="choice on" id="scoringDefault" type="button">指定なし</button><button class="choice" id="scoringOn" type="button">採点する</button></div></div>
    <div class="settingrow"><div class="settingname">演奏タイプ</div><div class="playchoices"><button class="choice on" data-play-type="standard" type="button">通常</button><button class="choice" data-play-type="artistVideo" type="button">本人映像</button><button class="choice" data-play-type="guideVocal" type="button">ガイド</button></div></div>
  </section>
  <div class="reservearea"><button class="reservebutton" id="reserveNormal" type="button">予約</button><button class="reservebutton cut" id="reserveCutIn" type="button">割り込み</button></div>
  <div class="detailmessage" id="detailMessage"></div>
</section>
<section class="view" id="view-queue"><div class="head"><h2>予約確認</h2><div><span class="count" id="queueCount">0曲</span> <button class="refresh" id="refreshQueue" type="button">更新</button></div></div><section class="queue" id="queue"><div class="empty">予約はありません</div></section></section>
<section class="view" id="view-history"><div class="head"><h2>再生履歴</h2><div><span class="count" id="historyCount">0曲</span> <button class="refresh" id="refreshHistory" type="button">更新</button></div></div><section class="list" id="history"><div class="empty">履歴はありません</div></section></section>
<section class="view" id="view-control">
  <div class="head"><h2>演奏操作</h2></div>
  <button class="globalscore" id="damScoring" type="button">ホームの採点設定<span>OFF</span></button>
  <section class="console"><div class="display"><div class="songtitle" id="controlTitle">再生中の曲はありません</div><div class="songmeta" id="controlArtist">曲を再生すると操作できます</div></div><div class="controls"><div class="control-label">キーコントロール</div><div class="keyrow"><button class="keybutton" data-control="keyDown">♭ 下げる</button><button class="keyreset" id="keyReset" data-control="keyReset">0</button><button class="keybutton" data-control="keyUp">♯ 上げる</button></div><div class="transportgrid"><button class="transport primary" id="pauseButton" data-control="pause">Ⅱ　一時停止</button><button class="transport" data-control="restart">↺　歌いなおし</button><button class="transport stop" data-control="stop">■　演奏停止</button></div></div></section>
</section>
</main>
<nav class="bottom"><div class="nav"><button class="active" data-view="search"><b>⌕</b>選曲</button><button data-view="queue"><b>☷</b>予約</button><button data-view="history"><b>履</b>履歴</button><button data-view="control"><b>●</b>演奏</button></div></nav>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let state={connected:false,playing:false,paused:false,key:0,damScoring:false,title:'',artist:'',videoId:''};
let activeView='search',searchMode='keyword',searchSequence=0,searchRequest=Promise.resolve(),reserveKey=0,originalKey=false,scoringRequested=false,playType='standard',busy=false,toastTimer=0,currentSongs=[],selectedSong=null,selectedDetail=null,detailOrigin='search',detailLoading=false,detailSequence=0,historyBusy=false;
async function api(path,body={}){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let data={};try{data=await response.json()}catch(_){}if(!response.ok)throw new Error(data.error||'通信に失敗しました');return data}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function keyText(k){return k>0?`♯${k}`:k<0?`♭${-k}`:'0'}
function renderState(next){state=next;$('lamp').classList.toggle('on',next.connected);$('connection').textContent=next.connected?'DAM接続中':'DAM未接続';const playing=next.playing===true;$('playmark').textContent=playing?(next.paused?'Ⅱ':'▶'):'■';$('nowtitle').textContent=playing?(next.title||'曲名取得中'):'再生中の曲はありません';$('nowartist').textContent=playing?(next.artist||next.videoId||''):'{{PRODUCT_NAME}}';$('keymini').textContent=keyText(next.key||0);$('controlTitle').textContent=playing?(next.title||'曲名取得中'):'再生中の曲はありません';$('controlArtist').textContent=playing?(next.artist||next.videoId||''):'曲を再生すると操作できます';$('keyReset').textContent=keyText(next.key||0);const pause=$('pauseButton');pause.dataset.control=next.paused?'resume':'pause';pause.textContent=next.paused?'▶　再開':'Ⅱ　一時停止';const damScore=$('damScoring');damScore.classList.toggle('on',next.damScoring===true);damScore.querySelector('span').textContent=next.damScoring?'ON':'OFF';damScore.disabled=!next.connected||busy;document.querySelectorAll('[data-control]').forEach(e=>e.disabled=!playing||busy)}
async function refreshState(silent=true){try{renderState(await api('api/state'))}catch(e){renderState({...state,connected:false});if(!silent)toast(e.message)}}
function switchView(name){activeView=name;document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===`view-${name}`));document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('active',e.dataset.view===name));if(name==='queue')refreshQueue();if(name==='history')refreshHistory()}
document.querySelectorAll('.nav button').forEach(e=>e.onclick=()=>switchView(e.dataset.view));
$('nowPlaying').onclick=()=>switchView('control');
function clearSearchResults(message){currentSongs=[];$('resultCount').textContent='';$('results').replaceChildren(node('div',message,'empty'))}
function setMode(mode){searchSequence++;searchMode=mode;document.querySelectorAll('.mode').forEach(e=>e.classList.toggle('active',e.dataset.mode===mode));const needs=['keyword','title','artist'].includes(mode);$('search').classList.toggle('hidden',!needs);$('query').placeholder=mode==='title'?'曲名を入力':mode==='artist'?'歌手名を入力':'曲名・歌手名・歌詞を入力';$('searchButton').disabled=false;if(needs){$('searchStatus').textContent='検索語を入力してください';clearSearchResults('検索結果がここに表示されます')}else{clearSearchResults('読み込み中…');runSearch('',mode)}}
document.querySelectorAll('.mode').forEach(e=>e.onclick=()=>setMode(e.dataset.mode));
async function runSearch(query,mode=searchMode,statusLabel=''){const sequence=++searchSequence;$('searchButton').disabled=true;$('searchStatus').textContent='検索しています…';clearSearchResults('読み込み中…');const request=searchRequest.catch(()=>{}).then(()=>sequence===searchSequence&&mode===searchMode?api('api/search',{query,mode}):null);searchRequest=request;try{const data=await request;if(data===null||sequence!==searchSequence||mode!==searchMode)return;const songs=Array.isArray(data.songs)?data.songs:[];currentSongs=songs;renderSongs(songs);$('resultCount').textContent=`${songs.length}件`;$('searchStatus').textContent=statusLabel||(mode==='ranking'?'人気曲ランキング':mode==='new'?'新曲一覧':mode==='favorites'?'お気に入り一覧':`検索結果 ${songs.length}件`)}catch(e){if(sequence!==searchSequence||mode!==searchMode)return;$('searchStatus').textContent=e.message;$('results').replaceChildren(node('div',e.message,'empty'))}finally{if(sequence===searchSequence)$('searchButton').disabled=false}}
$('search').onsubmit=e=>{e.preventDefault();const q=$('query').value.trim();if(!q){$('searchStatus').textContent='検索語を入力してください';return}runSearch(q)};
function makeSongRow(song,onSelect){const row=node('button',undefined,'selectrow');row.type='button';const text=node('div');text.append(node('div',song.title||'曲名不明','songtitle'),node('div',`${song.artist||'アーティスト不明'}${song.videoId?`　${song.videoId}`:''}`,'songmeta'));row.append(text,node('div','›','chevron'));row.onclick=onSelect;return row}
function renderSongs(songs){const list=$('results');list.replaceChildren();if(!songs.length){list.append(node('div','該当する曲はありません','empty'));return}for(const song of songs){if(song.kind==='artist'){const row=node('button',undefined,'selectrow');row.type='button';const text=node('div');text.append(node('div',song.artist||'歌手名不明','songtitle artistmark'),node('div','この歌手の曲を見る','songmeta'));row.append(text,node('div','›','chevron'));row.onclick=()=>showArtistSongs(song.artist);list.append(row);continue}list.append(makeSongRow(song,()=>openDetail(song,'search')))}}
function showArtistSongs(artist){if(!artist)return;switchView('search');setMode('keyword');$('query').value=artist;runSearch(artist,'keyword',`${artist}の曲`)}
function resetReservationOptions(){reserveKey=0;originalKey=false;scoringRequested=false;playType='standard';renderReservationOptions()}
function renderReservationOptions(){const supported=Array.isArray(selectedDetail?.playTypes)?selectedDetail.playTypes:[];$('reserveKey').textContent=keyText(reserveKey);$('reserveKeyDown').disabled=detailLoading||!selectedDetail||originalKey||reserveKey<=-7||busy;$('reserveKeyUp').disabled=detailLoading||!selectedDetail||originalKey||reserveKey>=7||busy;$('originalKey').disabled=detailLoading||!selectedDetail||busy;$('originalKey').textContent=selectedDetail?`原曲キー ${keyText(selectedDetail.originalKey||0)}`:'原曲キー';$('originalKey').classList.toggle('on',originalKey);$('scoringDefault').disabled=$('scoringOn').disabled=detailLoading||!selectedDetail||busy;$('scoringDefault').classList.toggle('on',!scoringRequested);$('scoringOn').classList.toggle('on',scoringRequested);document.querySelectorAll('[data-play-type]').forEach(e=>{e.hidden=!supported.includes(e.dataset.playType);e.disabled=detailLoading||busy;e.classList.toggle('on',e.dataset.playType===playType)});const canReserve=!detailLoading&&!!selectedDetail&&supported.length>0&&!busy;$('reserveNormal').disabled=$('reserveCutIn').disabled=!canReserve;$('detailFavorite').disabled=detailLoading||busy||!selectedSong?.token}
$('reserveKeyDown').onclick=()=>{reserveKey=Math.max(-7,reserveKey-1);renderReservationOptions()};$('reserveKeyUp').onclick=()=>{reserveKey=Math.min(7,reserveKey+1);renderReservationOptions()};$('originalKey').onclick=()=>{originalKey=!originalKey;renderReservationOptions()};$('scoringDefault').onclick=()=>{scoringRequested=false;renderReservationOptions()};$('scoringOn').onclick=()=>{scoringRequested=true;renderReservationOptions()};document.querySelectorAll('[data-play-type]').forEach(e=>e.onclick=()=>{playType=e.dataset.playType;renderReservationOptions()});
async function openDetail(song,origin){const sequence=++detailSequence;selectedSong=song;selectedDetail=null;detailLoading=true;detailOrigin=origin;resetReservationOptions();$('detailTitle').textContent=song.title||'曲名不明';$('detailArtist').textContent=song.artist||'アーティスト不明';$('detailArtist').disabled=!song.artist;$('artistSongs').disabled=!song.artist;$('detailId').textContent=song.videoId||'曲番号を取得しています';$('detailStartLyric').textContent='取得中…';$('detailOriginalKey').textContent='取得中…';$('detailFavorite').textContent=song.favorite?'★':'☆';$('detailFavorite').classList.toggle('on',song.favorite===true);$('detailMessage').textContent='曲情報を取得しています…';switchView('detail');renderReservationOptions();try{const data=await api('api/detail',{token:song.token});if(sequence!==detailSequence)return;const detail=data.detail;if(!detail||!Array.isArray(detail.playTypes))throw new Error('曲情報を取得できません');selectedDetail=detail;if(detail.videoId){song.videoId=detail.videoId;$('detailId').textContent=detail.videoId}$('detailStartLyric').textContent=detail.startLyric||'情報なし';$('detailOriginalKey').textContent=keyText(detail.originalKey||0);if(!detail.playTypes.includes(playType))playType=detail.playTypes.includes('standard')?'standard':detail.playTypes[0]||'standard';$('detailMessage').textContent=detail.playTypes.length?'':'予約可能な演奏タイプがありません'}catch(e){if(sequence!==detailSequence)return;$('detailStartLyric').textContent='取得できません';$('detailOriginalKey').textContent='取得できません';$('detailMessage').textContent=e.message}finally{if(sequence===detailSequence){detailLoading=false;renderReservationOptions()}}}
$('detailBack').onclick=()=>switchView(detailOrigin);$('detailArtist').onclick=()=>showArtistSongs(selectedSong?.artist||'');$('artistSongs').onclick=()=>showArtistSongs(selectedSong?.artist||'');
async function reserveSelected(cutIn){const song=selectedSong;if(!song||!song.token||!selectedDetail||!selectedDetail.playTypes.includes(playType)||busy)return;busy=true;renderReservationOptions();$('detailMessage').textContent='予約しています…';const mode=cutIn?'cutIn':originalKey?'originalKey':'normal';try{const data=await api('api/reserve',{token:song.token,mode,key:reserveKey,scoring:scoringRequested,playType}),message=data.message||(data.accepted?'予約しました':'予約できませんでした');$('detailMessage').textContent=message;toast(message);if(data.accepted)refreshQueue(true)}catch(e){$('detailMessage').textContent=e.message;toast(e.message)}finally{busy=false;renderReservationOptions()}}
$('reserveNormal').onclick=()=>reserveSelected(false);$('reserveCutIn').onclick=()=>reserveSelected(true);
async function favoriteSelected(){const song=selectedSong;if(!song||!song.token||detailLoading||busy)return;busy=true;renderReservationOptions();const wanted=!song.favorite;try{const data=await api('api/favorite',{token:song.token,favorite:wanted});if(data.accepted){song.favorite=data.favorite;$('detailFavorite').textContent=song.favorite?'★':'☆';$('detailFavorite').classList.toggle('on',song.favorite)}toast(data.message||'更新しました')}catch(e){toast(e.message)}finally{busy=false;renderReservationOptions()}}
$('detailFavorite').onclick=favoriteSelected;
function renderQueue(rows){const list=$('queue');list.replaceChildren();$('queueCount').textContent=`${rows.length}曲`;if(!rows.length){list.append(node('div','予約はありません','empty'));return}const normalCount=rows.filter(r=>!r.cutIn).length;rows.forEach(row=>{const item=node('article',undefined,'queueitem'),order=node('div',row.cutIn?'割込':String(row.index+1),`orderno${row.cutIn?' cut':''}`),body=node('div',undefined,'queuebody'),actions=node('div',undefined,'queueactions');body.append(node('div',row.title||'曲名取得中','songtitle'),node('div',row.artist||'アーティスト取得中','songmeta'));if(!row.cutIn){const up=node('button','↑ 上へ'),down=node('button','↓ 下へ');up.disabled=row.index===0;down.disabled=row.index>=normalCount-1;up.onclick=()=>queueAction('moveUp',row.token);down.onclick=()=>queueAction('moveDown',row.token);actions.append(up,down)}const remove=node('button','取消','remove');remove.onclick=()=>queueAction('remove',row.token);actions.append(remove);body.append(actions);item.append(order,body);list.append(item)})}
async function refreshQueue(silent=false){try{const data=await api('api/queue');renderQueue(Array.isArray(data.rows)?data.rows:[])}catch(e){if(!silent)toast(e.message)}}
async function queueAction(action,token){try{const data=await api('api/queue-action',{action,token});renderQueue(Array.isArray(data.rows)?data.rows:[]);toast(action==='remove'?'予約を取り消しました':'予約順を変更しました')}catch(e){toast(e.message);refreshQueue(true)}}
$('refreshQueue').onclick=()=>refreshQueue();
function renderHistory(rows){const list=$('history');list.replaceChildren();$('historyCount').textContent=`${rows.length}曲`;if(!rows.length){list.append(node('div','履歴はありません','empty'));return}rows.forEach(row=>list.append(makeSongRow(row,()=>openHistorySong(row))))}
async function openHistorySong(row){if(historyBusy||!row||!row.token)return;historyBusy=true;try{await openDetail(row,'history')}finally{historyBusy=false}}
async function refreshHistory(silent=false){try{const data=await api('api/history');renderHistory(Array.isArray(data.rows)?data.rows:[])}catch(e){if(!silent)toast(e.message)}}
$('refreshHistory').onclick=()=>refreshHistory();
$('damScoring').onclick=async()=>{if(!state.connected||busy)return;const wanted=state.damScoring!==true;busy=true;renderState(state);try{renderState(await api('api/control',{action:wanted?'scoringOn':'scoringOff'}));toast(`ホームの採点を${wanted?'ON':'OFF'}にしました`)}catch(e){toast(e.message)}finally{busy=false;refreshState(true)}};
document.querySelectorAll('[data-control]').forEach(button=>button.onclick=async()=>{const action=button.dataset.control;if(action==='stop'&&!confirm('現在の演奏を停止しますか？'))return;busy=true;renderState(state);try{renderState(await api('api/control',{action}));toast(action==='restart'?'最初から歌いなおします':action==='stop'?'演奏を停止しました':action==='pause'?'一時停止しました':action==='resume'?'再開しました':'キーを変更しました')}catch(e){toast(e.message)}finally{busy=false;refreshState(true)}});
renderReservationOptions();refreshState(false);setInterval(()=>refreshState(true),2000);setInterval(()=>{if(activeView==='queue')refreshQueue(true)},5000);
</script>
</body>
