[package]
name = "updater"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "updater"
path = "src/lib.rs"

[[bin]]
name = "updater"
path = "src/main.rs"
test = false

[dependencies]
serde_json = "1.0.145"
sha2 = "0.11.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
zip = { version = "9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
