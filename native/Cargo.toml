[workspace]
resolver = "3"
members = ["dam-link", "scoring-overlay", "updater"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["nnnnnnn0090"]
publish = false
rust-version = "1.99"

[workspace.dependencies]
serde_json = "1.0.145"
sha2 = "0.11.1"
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
