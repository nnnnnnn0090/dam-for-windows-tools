name: dam_for_windows_tools
description: "DAM for Windows向け。モジュール・フォアグラウンドチェックの切替、動画差し替え・開始位置調整、採点表現表示、スマホでの楽曲検索・詳細表示・予約・お気に入り・履歴・予約管理・演奏・キー・採点操作に対応する統合ツール。"
# 誤って`flutter pub publish`でpub.devへ公開しないようにします。
publish_to: 'none' # pub.devへ公開する場合だけこの行を削除します。

# アプリ版は`メジャー.マイナー.パッチ+ビルド番号`で定義します。
# `flutter build`の`--build-name`と`--build-number`で上書きできます。
# Windowsではbuild-nameが製品・ファイル版の3要素、build-numberが末尾になります。
version: 1.1.0+2

environment:
  sdk: ^3.13.1

# 実行時依存は用途を確認して固定範囲を更新し、`flutter pub outdated`で差分を確認します。
dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.6
  ffi: ^2.1.4
  file_picker: ^12.0.0
  path: ^1.9.1

dev_dependencies:
  # `flutter_lints`の推奨規則はルートのanalysis_options.yamlで有効化します。
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Dart共通項目は https://dart.dev/tools/pub/pubspec を参照してください。

# ここからFlutter固有のアセット設定です。
flutter:

  assets:
    - assets/scoring/
    - assets/remote/index.html
    - assets/remote/icons.svg
    - assets/remote/styles.css
    - assets/remote/app.js
    - assets/updater/update.ps1
    - LICENSE
    - LEGAL_NOTICE.md
    - THIRD_PARTY_NOTICES.md
    - legal/Frida-LGPL-2.0.txt
    - legal/Lucide-ISC.txt
    - legal/Microsoft-Visual-Cpp-Runtime.txt
    - legal/Node.js.txt
    - legal/QR-Code-generator-MIT.txt
    - legal/WxWindows-exception-3.1.txt

  # Material Iconsフォントをアプリへ同梱します。
  uses-material-design: true

  # アセットを追加する場合の記述例です。
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # 解像度別画像の指定方法は次を参照してください。
  # https://flutter.dev/to/resolution-aware-images

  # 依存パッケージのアセット指定方法は次を参照してください。
  # https://flutter.dev/to/asset-from-package

  # 独自フォントを追加する場合はflutter配下にfontsセクションを定義します。
  # familyへフォント名、fontsへアセットと属性を指定する例です。
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # 依存パッケージのフォント指定は https://flutter.dev/to/font-from-package を参照してください。
