include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - windows/**
    - native/**
    - helper/**
    - tool/**
    - android/**
    - ios/**
    - web/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - discarded_futures
    - avoid_dynamic_calls
    - only_throw_errors
    - cancel_subscriptions
    - close_sinks
