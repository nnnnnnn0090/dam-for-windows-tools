# Dartコードのエラー・警告・Lintを静的検査するAnalyzer設定です。
#
# 検出内容はDart対応IDEへ表示され、`flutter analyze`からも同じ検査を実行できます。

# Flutterアプリ向けの推奨Lint規則を基準として読み込みます。
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  # 上で読み込んだ規則の無効化や追加規則は、このセクションで明示します。
  # 利用可能な規則は https://dart.dev/lints を参照してください。
  #
  # 一部だけを除外する場合は全体規則を無効にせず、対象行の`ignore`または
  # 対象ファイルの`ignore_for_file`を理由付きで使用します。
  rules:
    # avoid_print: false  # `avoid_print`を無効にする場合の例です。
    # prefer_single_quotes: true  # `prefer_single_quotes`を有効にする場合の例です。

# 詳細は https://dart.dev/guides/language/analysis-options を参照してください。
